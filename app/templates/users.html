{% extends "base.html" %}

{% block title %}Users{% endblock %}

{% block content %}

<h2 class="mb-4">Users</h2>

<!-- Add User Form -->
<div class="card mb-4">
  <div class="card-header">
    Add New User
  </div>

  <div class="card-body">
    <form method="POST" action="{{ url_for('main.add_user') }}">
      <div class="row">
        <div class="col-md-3">
          <input type="text" name="name" class="form-control" placeholder="Full Name">
        </div>

        <div class="col-md-3">
          <input type="text" name="username" class="form-control" placeholder="Username">
        </div>

        <div class="col-md-3">
          <input type="email" name="email" class="form-control" placeholder="Email">
        </div>

        <div class="col-md-2">
          <select name="role" class="form-control">
            <option value="">Select Role</option>
            <option value="Owner">Owner</option>
            <option value="Customer">Customer</option>
          </select>
        </div>

        <div class="col-md-1">
          <button type="submit" class="btn btn-primary">Add</button>
        </div>
      </div>
    </form>
  </div>
</div>

<!-- Users Table -->
<table class="table table-bordered table-striped">
  <thead>
    <tr>
      <th>Name</th>
      <th>Username</th>
      <th>Email</th>
      <th>Role</th>
      <th>Edit</th>
      <th>Delete</th>
    </tr>
  </thead>

  <tbody>
    {% for user in users %}
    <tr>
      <form method="POST" action="{{ url_for('main.edit_user', user_id=user.user_id) }}">
        <td>
          <input type="text" name="name" class="form-control" value="{{ user.name }}">
        </td>

        <td>
          <input type="text" name="username" class="form-control" value="{{ user.username }}">
        </td>

        <td>
          <input type="email" name="email" class="form-control" value="{{ user.email }}">
        </td>

        <td>
          <select name="role" class="form-control">
            <option value="Owner" {% if user.role == "Owner" %}selected{% endif %}>Owner</option>
            <option value="Customer" {% if user.role == "Customer" %}selected{% endif %}>Customer</option>
          </select>
        </td>

        <td>
          <button type="submit" class="btn btn-success btn-sm">Save</button>
        </td>
      </form>

      <td>
        <form method="POST" action="{{ url_for('main.delete_user', user_id=user.user_id) }}">
          <button type="submit" class="btn btn-danger btn-sm">Delete</button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>

{% endblock %}
